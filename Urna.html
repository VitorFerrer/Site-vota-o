<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urna Eletrônica Escolar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8e8e4;--ink:#1c1c1c;--card:#fff;--mut:#666;--line:#c9c9c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d1b;--ink:#f1f1ee;--card:#2a2a27;--mut:#aaa;--line:#444}}
:root[data-theme="dark"]{--bg:#1d1d1b;--ink:#f1f1ee;--card:#2a2a27;--mut:#aaa;--line:#444}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:12px}
.tabs{display:flex;gap:8px;max-width:900px;margin:0 auto 10px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-weight:700;cursor:pointer}
.tabs button.on{background:#1e6b3a;color:#fff;border-color:#1e6b3a}
.urna{max-width:900px;margin:0 auto;background:#d6d6d0;border-radius:14px;padding:16px;display:grid;grid-template-columns:1.6fr 1fr;gap:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);color:#1c1c1c}
@media(max-width:700px){.urna{grid-template-columns:1fr}}
.screen{background:#f4f6ee;border:6px solid #3d3d3a;border-radius:8px;min-height:380px;padding:14px;display:flex;flex-direction:column;position:relative}
.top{font-size:13px;letter-spacing:.08em;font-weight:700;border-bottom:2px solid #1c1c1c;padding-bottom:6px;margin-bottom:10px}
.mid{display:flex;gap:14px;flex:1;align-items:flex-start}
.info{flex:1}
.lbl{font-size:12px;color:#444;margin-top:8px}
.numrow{display:flex;gap:6px;align-items:center;margin:4px 0 8px}
.numbox{width:48px;height:56px;border:2px solid #1c1c1c;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff}
.nome{font-size:22px;font-weight:800;line-height:1.1}
.warn{font-size:20px;font-weight:800;margin-top:6px}
.photo{width:128px;height:160px;border:2px solid #1c1c1c;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.empty{color:#999;font-size:12px;text-align:center}
.foot{border-top:2px solid #1c1c1c;margin-top:auto;padding-top:6px;font-size:12px;color:#222}
.fim{margin:auto;text-align:center}
.fim b{font-size:96px;display:block;line-height:1}
.fim span{font-size:20px;font-weight:700}
.pad{background:#2e2e2b;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.brand{color:#ddd;font-size:12px;letter-spacing:.2em;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:240px}
.key{height:52px;border:0;border-radius:6px;background:#111;color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #000}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.key.hi{outline:2px solid #fbbf24}
.ctl{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;width:100%;max-width:240px;margin-top:6px}
.ctl .key{font-size:11px;height:48px;color:#111;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.b{background:#fff}.c{background:#f97316}.k{background:#22a447;color:#fff!important}
.msg{max-width:900px;margin:10px auto 0;padding:10px 12px;border-radius:8px;background:#fde68a;color:#422;font-size:14px}
.msg.err{background:#fecaca}
.hide{display:none!important}
.ap{max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.lead{font-size:24px;font-weight:800}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa}.dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.row{margin:12px 0}
.row .h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.bar{height:26px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px}
.mini b{display:block;font-size:26px}
.up{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.up label{border:1px solid var(--line);padding:8px 10px;border-radius:8px;cursor:pointer}
.up input{display:none}
</style>
</head>
<body>
<div class="tabs hide" id="tabs">
  <button id="t1" class="on">Urna</button>
  <button id="t2">Apuração em tempo real</button>
</div>

<main id="vUrna">
  <div class="urna">
    <div class="screen" id="screen"></div>
    <div class="pad">
      <div class="brand">URNA ESCOLAR</div>
      <div class="keys" id="keys"></div>
      <div class="ctl">
        <button class="key b" id="kBranco">BRANCO</button>
        <button class="key c" id="kCorrigir">CORRIGIR</button>
        <button class="key k" id="kConfirmar">CONFIRMA</button>
      </div>
    </div>
  </div>
  <div class="msg hide" id="msg"></div>
</main>

<main class="ap hide" id="vAp">
  <div class="card">
    <div class="live"><span class="dot" id="dot"></span><span id="status">Conectando…</span></div>
    <div class="lead" id="lead" style="margin-top:8px">Aguardando votos…</div>
    <div style="color:var(--mut);margin-top:4px" id="total">0 votos</div>
  </div>
  <div class="card" id="bars"></div>
  <div class="card"><div class="grid" id="extra"></div></div>
  <div class="card">
    <b>Fotos das chapas</b>
    <div class="up" style="margin-top:8px">
      <label>Foto CHAPA RPE (3)<input type="file" accept="image/*" data-k="3"></label>
      <label>Foto CHAPA MERAKI (5)<input type="file" accept="image/*" data-k="5"></label>
    </div>
  </div>
</main>

<script>
const CH={'5':{nome:'CHAPA MERAKI',cor:'#c026d3'},'3':{nome:'CHAPA RPE',cor:'#0284c7'}};
let db=null,user=null,isAdmin=false,canVote=false,why='';
let digit=null,mode='idle',busy=false,fotos={},ctx=null;
const $=id=>document.getElementById(id);
const show=(t,err)=>{const m=$('msg');m.textContent=t;m.className='msg'+(err?' err':'');};
const hideMsg=()=>$('msg').classList.add('hide');

/* teclado */
const order=['1','2','3','4','5','6','7','8','9','','0',''];
order.forEach(n=>{const b=document.createElement('button');if(!n){b.style.visibility='hidden';}else{b.className='key';b.textContent=n;b.onclick=()=>press(n);}$('keys').appendChild(b);});
$('kBranco').onclick=()=>{if(busy||mode==='end')return;digit=null;mode='blank';render();};
$('kCorrigir').onclick=()=>{if(busy||mode==='end')return;digit=null;mode='idle';render();};
$('kConfirmar').onclick=confirmar;
document.addEventListener('keydown',e=>{
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Enter')confirmar();
  else if(e.key==='Backspace')$('kCorrigir').click();
});

function press(n){
  if(busy||mode==='end')return;
  digit=n;mode=CH[n]?'cand':'null';render();
}

function photoHTML(k){
  if(fotos['f'+k])return `<div class="photo"><img alt="${CH[k].nome}" src="${fotos['f'+k]}"></div>`;
  return `<div class="photo empty" style="color:${CH[k].cor}"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><br>${CH[k].nome}</div>`;
}

function render(){
  const s=$('screen');
  const top='<div class="top">ELEIÇÃO DO GRÊMIO ESTUDANTIL</div>';
  const foot='<div class="foot">Aperte a tecla:<br>VERDE para CONFIRMAR este voto · LARANJA para CORRIGIR</div>';
  if(mode==='end'){
    s.innerHTML=top+'<div class="fim"><b>FIM</b><span>VOTOU</span></div>';return;
  }
  if(mode==='blank'){
    s.innerHTML=top+'<div class="mid"><div class="info"><div class="lbl">SEU VOTO PARA</div><div class="warn" style="font-size:30px;margin-top:30px">VOTO EM BRANCO</div></div></div>'+foot;return;
  }
  const box=`<div class="numrow"><div class="numbox">${digit??''}</div></div>`;
  if(mode==='cand'){
    s.innerHTML=top+`<div class="mid"><div class="info"><div class="lbl">SEU VOTO PARA</div><div class="lbl">Número:</div>${box}<div class="lbl">Nome:</div><div class="nome" style="color:${CH[digit].cor}">${CH[digit].nome}</div></div>${photoHTML(digit)}</div>`+foot;return;
  }
  if(mode==='null'){
    s.innerHTML=top+`<div class="mid"><div class="info"><div class="lbl">SEU VOTO PARA</div><div class="lbl">Número:</div>${box}<div class="warn">NÚMERO ERRADO</div><div class="warn">VOTO NULO</div></div></div>`+foot;return;
  }
  s.innerHTML=top+`<div class="mid"><div class="info"><div class="lbl">SEU VOTO PARA</div><div class="lbl">Número:</div>${box}<div class="lbl" style="margin-top:16px">Digite <b>3</b> (CHAPA RPE) ou <b>5</b> (CHAPA MERAKI)</div></div></div>`+foot;
}

function beep(){
  try{
    ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
    o.type='square';o.frequency.value=880;
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);
    g.gain.setValueAtTime(.25,t+.9);g.gain.exponentialRampToValueAtTime(.001,t+1.05);
    o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.1);
  }catch(e){}
}

async function confirmar(){
  if(busy||mode==='idle'||mode==='end')return;
  try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}
  if(!canVote){show(why||'Sem permissão para gravar votos.',true);return;}
  const c=mode==='blank'?'branco':mode==='null'?'nulo':digit;
  busy=true;$('kConfirmar').style.opacity=.5;hideMsg();
  try{
    await db.collection('votes').add({c,t:Date.now()});
    beep();mode='end';digit=null;render();
    setTimeout(()=>{mode='idle';busy=false;$('kConfirmar').style.opacity=1;render();},3500);
  }catch(e){
    busy=false;$('kConfirmar').style.opacity=1;
    show('O voto NÃO foi registrado ('+(e&&e.code||'erro')+'). Seu voto continua na tela: confira a internet e aperte CONFIRMA novamente.',true);
  }
}

/* apuração */
function tally(docs){
  const n={'5':0,'3':0,branco:0,nulo:0};
  docs.forEach(d=>{const v=d.data();if(v&&v.c in n)n[v.c]++;});
  const total=n['5']+n['3']+n.branco+n.nulo,valid=n['5']+n['3'];
  const pct=(x,b)=>b?(x/b*100).toFixed(1).replace('.',','):'0,0';
  $('total').textContent=total+(total===1?' voto computado':' votos computados')+' · '+valid+' válidos';
  let lead='Aguardando votos…';
  if(total>0){
    if(n['5']>n['3'])lead='🏆 CHAPA MERAKI está vencendo';
    else if(n['3']>n['5'])lead='🏆 CHAPA RPE está vencendo';
    else lead=valid?'⚖️ EMPATE entre as chapas':'Ainda sem votos válidos';
  }
  $('lead').textContent=lead;
  $('bars').innerHTML=['5','3'].map(k=>`<div class="row"><div class="h"><span>${CH[k].nome} (${k})</span><span>${n[k]} · ${pct(n[k],total)}%</span></div><div class="bar"><i style="background:${CH[k].cor};width:${total?n[k]/total*100:0}%"></i></div></div>`).join('');
  $('extra').innerHTML=`<div class="mini"><b>${n.branco}</b>Brancos</div><div class="mini"><b>${n.nulo}</b>Nulos</div><div class="mini"><b>${total}</b>Total</div>`;
  $('status').textContent='Ao vivo · atualizado às '+new Date().toLocaleTimeString('pt-BR');
  $('dot').classList.add('on');
}

function resize(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const m=360,r=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*r;c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8));};
    img.onerror=rej;img.src=u;
  });
}

async function init(){
  render();
  try{db=await claude.use('db');}catch(e){db=null;}
  try{user=await claude.use('user');}catch(e){user=null;}
  isAdmin=!!(user&&(user.isOwner()||user.canEdit()));
  let w=null;try{w=user?await user.can('data.write'):null;}catch(e){}
  canVote=!!db&&w!==false;
  if(!db)why='Não foi possível conectar à urna: é preciso estar logado no Claude e abrir o link de votação.';
  else if(w===false)why='Esta conta só tem acesso de visualização e não pode gravar votos. A coordenação precisa liberar o acesso como Contribuidor.';
  if(why)show(why,true);
  if(!db)return;
  db.doc('config/fotos').onSnapshot(s=>{fotos=s.exists?s.data():{};render();},()=>{});
  if(isAdmin){
    if(location.hash==='#apuracao')sw(2);
    db.collection('votes').onSnapshot(s=>tally(s.docs),e=>{$('status').textContent='Falha na conexão ('+e.code+')';$('dot').classList.remove('on');});
    $('t1').onclick=()=>sw(1);$('t2').onclick=()=>sw(2);
    document.querySelectorAll('.up input').forEach(i=>i.onchange=async()=>{
      const f=i.files[0];if(!f)return;
      try{const url=await resize(f);const nv={...fotos,['f'+i.dataset.k]:url};await db.doc('config/fotos').set(nv);}
      catch(e){alert('Não foi possível salvar a foto.');}
    });
  }
}
function sw(n){
  $('vUrna').classList.toggle('hide',n!==1);$('vAp').classList.toggle('hide',n!==2);
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);
}
init();
</script>
</body>
</html>
