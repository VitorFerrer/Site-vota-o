<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna Eletrônica Escolar</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#e8e8e4;color:#1c1c1c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.urna{max-width:900px;margin:0 auto;background:#d6d6d0;border-radius:14px;padding:16px;display:grid;grid-template-columns:1.8fr 1fr;gap:16px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media(max-width:700px){.urna{grid-template-columns:1fr}}
.screen{background:#f4f6ee;border:6px solid #3d3d3a;border-radius:8px;min-height:420px;padding:12px;display:flex;flex-direction:column}
.top{font-size:13px;letter-spacing:.08em;font-weight:700;border-bottom:2px solid #1c1c1c;padding-bottom:6px;margin-bottom:10px}
.chapas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chapa{border:3px solid #bbb;border-radius:8px;background:#fff;overflow:hidden;opacity:.75;transition:.15s}
.chapa.sel{border-color:#22a447;opacity:1;box-shadow:0 0 0 3px rgba(34,164,71,.35)}
.chapa .cab{color:#fff;text-align:center;padding:6px 4px;line-height:1.1}
.chapa .cab b{display:block;font-size:15px;letter-spacing:.03em}
.chapa .cab span{font-size:30px;font-weight:900}
.chapa img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}
.res{margin-top:10px;display:flex;gap:10px;align-items:center;min-height:62px}
.numbox{width:46px;height:54px;border:2px solid #1c1c1c;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.res .t{font-size:20px;font-weight:800;line-height:1.1}.res small{display:block;font-size:12px;font-weight:400;color:#444}
.foot{border-top:2px solid #1c1c1c;margin-top:auto;padding-top:6px;font-size:12px}
.fim{margin:auto;text-align:center}.fim b{font-size:96px;display:block;line-height:1}.fim span{font-size:20px;font-weight:700}
.fim .cd{display:block;margin-top:14px;font-size:16px;font-weight:600;color:#444}
.pad{background:#2e2e2b;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.brand{color:#ddd;font-size:12px;letter-spacing:.2em;font-weight:700}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:240px}
.key{height:64px;border:0;border-radius:6px;background:#111;color:#fff;font-size:34px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #000}
.key:active{transform:translateY(2px)}
.ctl{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;width:100%;max-width:240px;margin-top:6px}
.ctl .key{font-size:11px;height:50px;color:#111}
.n{background:#fff}.c{background:#f97316}.k{background:#22a447;color:#fff!important}
.msg{max-width:900px;margin:10px auto 0;padding:10px 12px;border-radius:8px;background:#fecaca;font-size:14px}
.hide{display:none!important}
.ap{max-width:900px;margin:0 auto}
.card{background:#fff;border:1px solid #c9c9c2;border-radius:12px;padding:16px;margin-bottom:12px}
.lead{font-size:26px;font-weight:800}.mut{color:#666;font-size:14px;margin-top:4px}
.row{margin:12px 0}.row .h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.bar{height:26px;background:#e4e4de;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .5s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{text-align:center;padding:10px;border:1px solid #c9c9c2;border-radius:8px}.mini b{display:block;font-size:26px}
</style>
</head>
<body>

<main id="vUrna">
  <div class="urna">
    <div class="screen" id="screen"></div>
    <div class="pad">
      <div class="brand">URNA ESCOLAR</div>
      <div class="keys">
        <button class="key" id="k3">3</button>
        <button class="key" id="k5">5</button>
      </div>
      <div class="ctl">
        <button class="key n" id="kNulo">NULO</button>
        <button class="key c" id="kCorrigir">CORRIGE</button>
        <button class="key k" id="kConfirmar">CONFIRMA</button>
      </div>
    </div>
  </div>
  <div class="msg hide" id="msg"></div>
</main>

<main class="ap hide" id="vAp">
  <div class="card">
    <div class="mut" id="status">Conectando…</div>
    <div class="lead" id="lead" style="margin-top:8px">Aguardando votos…</div>
    <div class="mut" id="total"></div>
  </div>
  <div class="card" id="bars"></div>
  <div class="card"><div class="grid" id="extra"></div></div>
</main>

<script>
// ============ CONFIGURAÇÃO ============
const API = 'https://script.google.com/macros/s/AKfycby-Pr1KsMGKEEHaEwdyBFqINEw14r3uwbYc-saqQ3kpO-5N5iiZALd2YKWo9MWbzNeA/exec';  // URL do Apps Script (termina em /exec)

// >>> FOTO DE CADA CHAPA <<<
// Por enquanto fica vazio e a urna mostra uma imagem de exemplo.
// Para trocar, escreva o nome do arquivo (na mesma pasta deste arquivo) ou um link de imagem. Ex.: '3': 'chapa-rpe.jpg'
const IMAGENS = { '3': '', '5': '' };

const TEMPO_BLOQUEIO = 20; // segundos de espera depois de cada voto confirmado
// =====================================

const CH = { '3': { nome: 'CHAPA RPE', cor: '#0284c7' }, '5': { nome: 'CHAPA MERAKI', cor: '#c026d3' } };
const $ = id => document.getElementById(id);
let digit = null, mode = 'idle', busy = false, ctx = null, timer = null;

function exemplo(k) { // imagem de exemplo (substituída quando você definir IMAGENS)
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="${CH[k].cor}22"/><circle cx="200" cy="115" r="48" fill="${CH[k].cor}"/><path d="M95 285c0-62 47-95 105-95s105 33 105 95z" fill="${CH[k].cor}"/><text x="200" y="40" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" fill="${CH[k].cor}">FOTO DA ${CH[k].nome}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
}
function img(k) { return IMAGENS[k] || exemplo(k); }

/* ---------- URNA ---------- */
$('k3').onclick = () => press('3');
$('k5').onclick = () => press('5');
$('kNulo').onclick = () => { if (!busy && mode !== 'end') { digit = null; mode = 'null'; hideErro(); render(); } };
$('kCorrigir').onclick = () => { if (!busy && mode !== 'end') { digit = null; mode = 'idle'; hideErro(); render(); } };
$('kConfirmar').onclick = confirmar;
document.addEventListener('keydown', e => {
  if ($('vUrna').classList.contains('hide')) return;
  if (e.key === '3' || e.key === '5') press(e.key);
  else if (e.key === 'Enter') confirmar();
  else if (e.key === 'Backspace') $('kCorrigir').click();
});
function press(n) { if (busy || mode === 'end') return; digit = n; mode = 'cand'; hideErro(); render(); }

function render() {
  const top = '<div class="top">ELEIÇÃO DO GRÊMIO ESTUDANTIL</div>';
  if (mode === 'end') {
    $('screen').innerHTML = top + '<div class="fim"><b>FIM</b><span>VOTOU</span><span class="cd" id="cd"></span></div>';
    tick(); return;
  }
  const cards = ['3', '5'].map(k => `<div class="chapa ${mode === 'cand' && digit === k ? 'sel' : ''}">
    <div class="cab" style="background:${CH[k].cor}"><b>${CH[k].nome}</b><span>Nº ${k}</span></div>
    <img src="${img(k)}" alt="${CH[k].nome}" onerror="this.onerror=null;this.src='${exemplo(k).replace(/'/g, '%27')}'"></div>`).join('');
  let res;
  if (mode === 'cand') res = `<div class="numbox">${digit}</div><div class="t" style="color:${CH[digit].cor}">${CH[digit].nome}<small>Aperte CONFIRMA para votar</small></div>`;
  else if (mode === 'null') res = `<div class="t">VOTO NULO<small>Aperte CONFIRMA para votar nulo</small></div>`;
  else res = `<div class="t" style="font-size:16px;font-weight:600">Digite <b>3</b> (CHAPA RPE) ou <b>5</b> (CHAPA MERAKI)</div>`;
  $('screen').innerHTML = top + `<div class="chapas">${cards}</div><div class="res">${res}</div><div class="foot">VERDE: CONFIRMA · LARANJA: CORRIGE · BRANCO: NULO</div>`;
}

/* ---------- BLOQUEIO DE 20 s ---------- */
function bloquear(ate) {
  try { localStorage.setItem('urnaBloqueio', String(ate)); } catch (e) {}
  mode = 'end'; busy = true; digit = null; render();
  clearInterval(timer); timer = setInterval(tick, 250);
}
function tick() {
  let ate = 0; try { ate = +localStorage.getItem('urnaBloqueio') || 0; } catch (e) {}
  if (!window._ate || window._ate < ate) window._ate = ate;
  const falta = Math.ceil((window._ate - Date.now()) / 1000);
  if (falta > 0) { const cd = $('cd'); if (cd) cd.textContent = 'Próximo eleitor em ' + falta + ' s'; }
  else { clearInterval(timer); mode = 'idle'; busy = false; $('kConfirmar').style.opacity = 1; render(); }
}

function beep() {
  try {
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 880;
    g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02);
    g.gain.setValueAtTime(.25, t + .9); g.gain.exponentialRampToValueAtTime(.001, t + 1.05);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1.1);
  } catch (e) {}
}
function erro(t) { const m = $('msg'); m.textContent = t; m.classList.remove('hide'); }
function hideErro() { $('msg').classList.add('hide'); }

async function enviar(c, id) {
  for (let i = 0; i < 3; i++) { // até 3 tentativas com o MESMO id (a planilha ignora repetidos)
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ c, id }), signal: ctl.signal });
      clearTimeout(to);
      const j = await r.json();
      if (j.ok) return true;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 1200));
  }
  return false;
}
async function confirmar() {
  if (busy || mode === 'idle' || mode === 'end') return;
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
  if (API.indexOf('COLE_AQUI') === 0) { erro('A urna ainda não foi configurada com a URL do Apps Script.'); return; }
  const c = mode === 'null' ? 'nulo' : digit;
  const id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
  busy = true; $('kConfirmar').style.opacity = .5; hideErro();
  if (await enviar(c, id)) {          // voto gravado na planilha
    beep();
    window._ate = Date.now() + TEMPO_BLOQUEIO * 1000;
    bloquear(window._ate);
  } else {
    busy = false; $('kConfirmar').style.opacity = 1;
    erro('O voto NÃO foi registrado (sem conexão com a planilha). Seu voto continua na tela: confira a internet e aperte CONFIRMA de novo.');
  }
}

/* ---------- APURAÇÃO ---------- */
function tally(t) {
  const n = { '5': +t['5'], '3': +t['3'], nulo: +t.nulo };
  const total = n['5'] + n['3'] + n.nulo, valid = n['5'] + n['3'];
  const pct = (x, b) => b ? (x / b * 100).toFixed(1).replace('.', ',') : '0,0';
  $('total').textContent = total + ' votos computados · ' + valid + ' válidos';
  let lead = 'Aguardando votos…';
  if (total > 0) lead = n['5'] > n['3'] ? '🏆 CHAPA MERAKI está vencendo' : n['3'] > n['5'] ? '🏆 CHAPA RPE está vencendo' : (valid ? '⚖️ EMPATE entre as chapas' : 'Ainda sem votos válidos');
  $('lead').textContent = lead;
  $('bars').innerHTML = ['3', '5'].map(k => `<div class="row"><div class="h"><span>${CH[k].nome} (${k})</span><span>${n[k]} · ${pct(n[k], total)}%</span></div><div class="bar"><i style="background:${CH[k].cor};width:${total ? n[k] / total * 100 : 0}%"></i></div></div>`).join('');
  $('extra').innerHTML = `<div class="mini"><b>${n.nulo}</b>Nulos</div><div class="mini"><b>${total}</b>Total</div>`;
}
async function apurar(pin) {
  try {
    const r = await fetch(API + '?pin=' + encodeURIComponent(pin) + '&_=' + Date.now());
    const j = await r.json();
    if (!j.ok) { $('status').textContent = '❌ ' + j.erro; return j.erro !== 'senha incorreta'; }
    tally(j.t); $('status').textContent = '🟢 Ao vivo · atualizado às ' + new Date().toLocaleTimeString('pt-BR');
  } catch (e) { $('status').textContent = '🔴 Sem conexão — tentando de novo…'; }
  return true;
}
async function iniciarApuracao() {
  $('vUrna').classList.add('hide'); $('vAp').classList.remove('hide');
  const pin = prompt('Senha da apuração:');
  if (pin === null) return;
  if (await apurar(pin) === false) return;
  setInterval(() => apurar(pin), 3000);
}

if (location.hash === '#apuracao') iniciarApuracao();
else {
  let ate = 0; try { ate = +localStorage.getItem('urnaBloqueio') || 0; } catch (e) {}
  if (ate > Date.now()) { window._ate = ate; bloquear(ate); } else render(); // continua bloqueada se a página for recarregada
}
window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
